<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wyze Add-ons Kahoot-Style Challenge!</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* Base Styles - Kahoot Vibe */
        body {
            font-family: 'Montserrat', sans-serif;
            background-color: #f2f2f2;
            color: #333;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Screen Management */
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 20px;
            width: 100%;
            box-sizing: border-box;
        }

        .screen.active {
            display: flex;
            animation: fadeIn 0.3s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Start Screen */
        #start-screen {
            background-color: #46178f; /* Kahoot Purple */
            color: white;
            text-align: center;
        }

        .logo {
            font-size: 60px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 2px 2px 0px rgba(0,0,0,0.2);
        }

        .subtitle {
            font-size: 24px;
            font-weight: 700;
            margin-bottom: 40px;
        }

        .btn-start {
            background-color: #333;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: 800;
            border-radius: 4px;
            cursor: pointer;
            box-shadow: 0 4px 0 #000;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-start:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #000;
        }

        /* Quiz Header (Top Bar) */
        .quiz-header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 30px;
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            position: fixed;
            top: 0;
            left: 0;
            box-sizing: border-box;
            z-index: 10;
        }

        .question-counter {
            font-size: 20px;
            font-weight: 700;
            color: #666;
        }

        .score-display {
            font-size: 24px;
            font-weight: 800;
            color: #333;
            background-color: #f2f2f2;
            padding: 5px 15px;
            border-radius: 20px;
        }

        /* Timer Circle */
        .timer-container {
            position: relative;
            width: 60px;
            height: 60px;
        }

        .timer-circle {
            transform: rotate(-90deg);
            width: 60px;
            height: 60px;
        }

        .timer-circle circle {
            fill: none;
            stroke-width: 6;
            stroke-linecap: round;
        }

        .timer-bg {
            stroke: #e0e0e0;
        }

        .timer-prog {
            stroke: #864cbf; /* Purple timer */
            stroke-dasharray: 163; /* 2 * pi * r (approx 26 * 2 * 3.14) */
            stroke-dashoffset: 0;
            transition: stroke-dashoffset 1s linear, stroke 0.3s;
        }

        .timer-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 24px;
            font-weight: 800;
            color: #333;
        }

        .timer-urgent .timer-prog {
            stroke: #ff3355; /* Red when low */
        }
        .timer-urgent .timer-text {
            color: #ff3355;
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }


        /* Question Container Area */
        #quiz-screen {
            background-color: #f2f2f2;
            padding-top: 100px; /* Space for header */
            justify-content: flex-start;
        }

        .question-card {
            background-color: white;
            width: 100%;
            max-width: 900px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            text-align: center;
            margin-bottom: 20px;
            box-sizing: border-box;
        }

        .question-text {
            font-size: 32px;
            font-weight: 800;
            color: #333;
            margin: 0;
            line-height: 1.3;
        }

        /* Answer Grid (Kahoot Colors) */
        .answers-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .answers-grid {
                grid-template-columns: 1fr; /* Stack on mobile */
            }
        }

        .answer-btn {
            border: none;
            border-radius: 4px;
            padding: 30px 20px;
            font-size: 22px;
            font-weight: 700;
            color: white;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.2);
            transition: transform 0.1s, box-shadow 0.1s, filter 0.2s;
            display: flex;
            align-items: center;
            justify-content: flex-start; /* Align text left */
            position: relative;
            min-height: 120px; /* Ensure uniform height */
            word-wrap: break-word;
            text-align: left;
        }

        .answer-btn:active:not(:disabled) {
            transform: translateY(6px);
            box-shadow: 0 0 0 rgba(0,0,0,0.2);
        }

        .answer-btn:disabled {
            cursor: default;
        }

        /* Kahoot Colors for Buttons */
        .btn-color-0 { background-color: #e21b3c; } /* Red */
        .btn-color-1 { background-color: #1368ce; } /* Blue */
        .btn-color-2 { background-color: #d89e00; } /* Yellow */
        .btn-color-3 { background-color: #26890c; } /* Green */

        /* Shape Icons (Simulated with CSS shapes for Kahoot vibe) */
        .shape-icon {
            width: 30px;
            height: 30px;
            margin-right: 20px;
            background-color: white;
            flex-shrink: 0;
        }
        
        .shape-0 { clip-path: polygon(50% 0%, 0% 100%, 100% 100%); } /* Triangle */
        .shape-1 { clip-path: polygon(50% 0%, 100% 50%, 50% 100%, 0% 50%); } /* Diamond */
        .shape-2 { border-radius: 50%; } /* Circle */
        .shape-3 { /* Square */ } 


        /* Feedback Overlay (Correct/Incorrect) */
        #feedback-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none; /* Flex when active */
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            color: white;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        #feedback-overlay.correct-bg { background-color: #66bf39; } /* Kahoot Green */
        #feedback-overlay.incorrect-bg { background-color: #ff3355; } /* Kahoot Red */
        #feedback-overlay.time-up-bg { background-color: #ffb100; } /* Kahoot Orange */

        .feedback-title {
            font-size: 60px;
            font-weight: 900;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .feedback-score {
            font-size: 30px;
            background: rgba(0,0,0,0.2);
            padding: 10px 30px;
            border-radius: 30px;
            margin-bottom: 30px;
            font-weight: 700;
        }

        .feedback-rationale {
            font-size: 22px;
            max-width: 800px;
            background: rgba(255,255,255,0.9);
            color: #333;
            padding: 20px;
            border-radius: 8px;
            font-weight: 600;
            line-height: 1.4;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            margin-bottom: 40px;
        }

        .btn-next {
            background-color: rgba(0,0,0,0.3);
            color: white;
            border: 2px solid white;
            padding: 15px 40px;
            font-size: 24px;
            font-weight: 800;
            border-radius: 30px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn-next:hover {
            background-color: rgba(255,255,255,0.2);
        }

        /* Results Screen */
        #results-screen {
            background-color: #46178f;
            color: white;
            text-align: center;
        }

        .podium {
            display: flex;
            align-items: flex-end;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
            height: 300px;
        }

        .podium-place {
            width: 120px;
            background-color: #864cbf;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding-top: 20px;
            font-size: 40px;
            font-weight: 900;
            border-radius: 8px 8px 0 0;
            box-shadow: inset 0 -10px 0 rgba(0,0,0,0.2);
            position: relative;
        }

        .podium-1 { height: 250px; background-color: #ffb100; color: #fff;}
        .podium-player {
            position: absolute;
            top: -50px;
            font-size: 24px;
            font-weight: 700;
            color: white;
        }

        .final-score-text {
            font-size: 30px;
            margin-top: 40px;
            margin-bottom: 30px;
            background: rgba(0,0,0,0.2);
            padding: 15px 30px;
            border-radius: 30px;
        }

    </style>
</head>
<body>

    <!-- START SCREEN -->
    <div id="start-screen" class="screen active">
        <div class="logo">Wyze Add-ons!</div>
        <div class="subtitle">Cloud 60 & Billing Knowledge Check</div>
        <button class="btn-start" onclick="startQuiz()">Play Now!</button>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="quiz-screen" class="screen">
        <div class="quiz-header">
            <div class="question-counter" id="question-counter">1 of 10</div>
            
            <div class="timer-container">
                <svg class="timer-circle" viewBox="0 0 60 60">
                    <circle class="timer-bg" cx="30" cy="30" r="26"></circle>
                    <circle class="timer-prog" id="timer-path" cx="30" cy="30" r="26"></circle>
                </svg>
                <div class="timer-text" id="timer-text">20</div>
            </div>

            <div class="score-display">Score: <span id="score-val">0</span></div>
        </div>

        <div class="question-card">
            <h2 class="question-text" id="question-text">Question goes here?</h2>
        </div>

        <div class="answers-grid" id="answers-grid">
            <!-- Buttons injected by JS -->
        </div>
    </div>

    <!-- FEEDBACK OVERLAY -->
    <div id="feedback-overlay">
        <div class="feedback-title" id="feedback-title">Correct!</div>
        <div class="feedback-score" id="feedback-points">+850 points</div>
        <div class="feedback-rationale" id="feedback-rationale">Explanation goes here.</div>
        <button class="btn-next" onclick="nextQuestion()">Next</button>
    </div>

    <!-- RESULTS SCREEN -->
    <div id="results-screen" class="screen">
        <div class="logo">Podium</div>
        
        <div class="podium">
            <!-- Simulated Podium for style -->
            <div class="podium-place podium-1">
                <div class="podium-player">You!</div>
                1
            </div>
        </div>

        <div class="final-score-text">
            Final Score: <span id="final-score-val">0</span><br>
            <span style="font-size: 20px; font-weight: 400;" id="final-stats">8/10 Correct</span>
        </div>

        <button class="btn-start" onclick="location.reload()">Play Again</button>
    </div>

    <script>
        const quizData = [
            {
                question: "What is required before you can attach the Cloud 60 add-on to a camera?",
                options: [
                    "A brand new camera model.",
                    "An active Cam Plus or Cam Unlimited plan.",
                    "A pre-paid annual subscription.",
                    "An empty microSD card."
                ],
                correctIndex: 1,
                rationale: "Add-ons can't exist on their own; you need an active parent plan (Cam Plus or Cam Unlimited) on the device first."
            },
            {
                question: "How does the billing date for a new add-on work?",
                options: [
                    "It bills on the 1st of every month.",
                    "It bills independently on the day you bought it.",
                    "It aligns to bill on the same day as your base Wyze plan.",
                    "It only bills annually."
                ],
                correctIndex: 2,
                rationale: "Add-ons are designed to align with your current Wyze plan's billing date, often using a prorated first charge to sync up."
            },
            {
                question: "If a user upgrades to Cam Unlimited Pro, what happens to their separate Cloud 60 add-on?",
                options: [
                    "It converts to a Continuous Video Recording (CVR) plan.",
                    "It should stop renewing.",
                    "They receive a cash refund immediately.",
                    "It is automatically moved to a different camera."
                ],
                correctIndex: 1,
                rationale: "Cloud 60 is included in Cam Unlimited Pro, so the separate paid add-on becomes redundant and should stop renewing."
            },
            {
                question: "Can a customer move their Cloud 60 subscription directly to a different camera?",
                options: [
                    "Yes, by dragging it in the app.",
                    "Yes, but only via Support.",
                    "No, they must cancel it and buy a new one for the desired device.",
                    "No, add-ons are permanently locked to the first device."
                ],
                correctIndex: 2,
                rationale: "At launch, there is no direct move operation. The expected flow is to cancel the add-on on the old device and purchase a new one."
            },
            {
                question: "Cloud 60 is a monthly subscription. Is there an annual option available?",
                options: [
                    "Yes, it's cheaper annually.",
                    "Yes, but only if the base plan is annual.",
                    "No, it is monthly-only at launch.",
                    "Only for Cam Unlimited users."
                ],
                correctIndex: 2,
                rationale: "Cloud 60 (and add-ons generally at launch) are strictly monthly, even if the parent base plan is billed annually."
            },
            {
                question: "If a base plan is billed by Apple/Google, how is the Cloud 60 add-on billed?",
                options: [
                    "Apple/Google bills both on one receipt.",
                    "It cannot be purchased.",
                    "Wyze/Stripe bills the add-on separately.",
                    "It is included for free."
                ],
                correctIndex: 2,
                rationale: "The app store continues billing the base plan, while Wyze (via Stripe) handles the separate add-on billing, resulting in two receipts."
            },
            {
                question: "Can Cloud 60 recover events that were deleted after 14 days, before the add-on was purchased?",
                options: [
                    "Yes, it recovers the last 60 days instantly.",
                    "Yes, if requested through Support.",
                    "No, Cloud 60 is not retroactive.",
                    "Only if there is a microSD card installed."
                ],
                correctIndex: 2,
                rationale: "Cloud 60 is not retroactive. It cannot recover older events that were already purged under the standard 14-day policy prior to activation."
            },
            {
                question: "Can a user purchase Cloud 60 for a camera that is shared with them by another user?",
                options: [
                    "Yes, anyone with access can add features.",
                    "No, the purchasing user must be the primary owner.",
                    "Yes, but only via the web portal.",
                    "No, shared cameras do not support any cloud features."
                ],
                correctIndex: 1,
                rationale: "The purchasing customer must be the camera's primary owner. A camera shared with the signed-in user is not eligible."
            }
        ];

        // State variables
        let currentQIndex = 0;
        let totalScore = 0;
        let correctCount = 0;
        let timerInterval;
        let timeLeft = 20;
        const TIME_LIMIT = 20;
        let isAnswering = false; // Prevent double clicks

        // DOM Elements
        const screens = document.querySelectorAll('.screen');
        const questionText = document.getElementById('question-text');
        const answersGrid = document.getElementById('answers-grid');
        const qCounter = document.getElementById('question-counter');
        const scoreVal = document.getElementById('score-val');
        
        const timerText = document.getElementById('timer-text');
        const timerPath = document.getElementById('timer-path');
        const timerContainer = document.querySelector('.timer-container');

        const feedbackOverlay = document.getElementById('feedback-overlay');
        const feedbackTitle = document.getElementById('feedback-title');
        const feedbackPoints = document.getElementById('feedback-points');
        const feedbackRationale = document.getElementById('feedback-rationale');

        // Functions
        function switchScreen(screenId) {
            screens.forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function startQuiz() {
            currentQIndex = 0;
            totalScore = 0;
            correctCount = 0;
            scoreVal.innerText = '0';
            switchScreen('quiz-screen');
            loadQuestion();
        }

        function loadQuestion() {
            isAnswering = false;
            const q = quizData[currentQIndex];
            
            // Update Header
            qCounter.innerText = `${currentQIndex + 1} of ${quizData.length}`;
            questionText.innerText = q.question;

            // Generate Buttons
            answersGrid.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = `answer-btn btn-color-${idx}`;
                btn.innerHTML = `<div class="shape-icon shape-${idx}"></div> ${opt}`;
                btn.onclick = () => handleAnswer(idx);
                answersGrid.appendChild(btn);
            });

            startTimer();
        }

        function startTimer() {
            timeLeft = TIME_LIMIT;
            updateTimerUI();
            timerContainer.classList.remove('timer-urgent');

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerUI();

                if (timeLeft <= 5) {
                    timerContainer.classList.add('timer-urgent');
                }

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    handleAnswer(-1); // -1 means time's up
                }
            }, 1000);
        }

        function updateTimerUI() {
            timerText.innerText = timeLeft;
            // Calculate stroke offset
            const maxDash = 163;
            const percentage = timeLeft / TIME_LIMIT;
            const offset = maxDash - (percentage * maxDash);
            timerPath.style.strokeDashoffset = offset;
        }

        function handleAnswer(selectedIndex) {
            if (isAnswering) return;
            isAnswering = true;
            clearInterval(timerInterval);

            const q = quizData[currentQIndex];
            const isCorrect = selectedIndex === q.correctIndex;
            let pointsEarned = 0;

            // Visual feedback on buttons
            const btns = document.querySelectorAll('.answer-btn');
            btns.forEach((btn, idx) => {
                btn.disabled = true;
                if (idx !== q.correctIndex && idx !== selectedIndex) {
                    btn.style.filter = 'grayscale(80%) opacity(0.5)';
                }
            });

            // Calculate Score (Kahoot style: faster = more points. Max 1000)
            if (isCorrect) {
                pointsEarned = Math.round((timeLeft / TIME_LIMIT) * 500) + 500; 
                totalScore += pointsEarned;
                correctCount++;
                scoreVal.innerText = totalScore;
                
                showFeedback('correct', pointsEarned, q.rationale);
            } else if (selectedIndex === -1) {
                showFeedback('timeout', 0, q.rationale);
            } else {
                showFeedback('incorrect', 0, q.rationale);
            }
        }

        function showFeedback(type, points, rationale) {
            feedbackOverlay.className = ''; // reset classes
            feedbackOverlay.style.display = 'flex';
            feedbackRationale.innerText = rationale;

            if (type === 'correct') {
                feedbackOverlay.classList.add('correct-bg');
                feedbackTitle.innerText = "Correct!";
                feedbackPoints.innerText = `+${points} points`;
                feedbackPoints.style.display = 'block';
            } else if (type === 'incorrect') {
                feedbackOverlay.classList.add('incorrect-bg');
                feedbackTitle.innerText = "Incorrect!";
                feedbackPoints.style.display = 'none';
            } else {
                feedbackOverlay.classList.add('time-up-bg');
                feedbackTitle.innerText = "Time's Up!";
                feedbackPoints.style.display = 'none';
            }
        }

        function nextQuestion() {
            feedbackOverlay.style.display = 'none';
            currentQIndex++;
            
            if (currentQIndex < quizData.length) {
                loadQuestion();
            } else {
                showResults();
            }
        }

        function showResults() {
            switchScreen('results-screen');
            document.getElementById('final-score-val').innerText = totalScore;
            document.getElementById('final-stats').innerText = `${correctCount} out of ${quizData.length} Correct`;
        }

    </script>
</body>
</html>
